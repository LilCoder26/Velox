<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet">
    <style>
        body { 
            font-family: 'Garet', sans-serif; 
            background-color: #02349b; /* Your requested background */
            color: black;              /* Your requested text color */
            text-align: center; 
            padding: 50px; 
        }
        h1 { color: black; }
        input { padding: 10px; width: 300px; border: 2px solid black; border-radius: 5px; }
        button { padding: 10px 20px; background-color: black; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #results { margin-top: 20px; text-align: left; display: inline-block; color: black; }
        a { color: #0000ee; } /* Kept links blue so they stand out */
    </style>
</head>
<body>

    <h1>Velox Search</h1>
    <input type="text" id="searchInput" placeholder="What are you looking for?">
    <button onclick="searchVelox()">Search</button>
    <div id="results"></div>

    <script>
        async function searchVelox() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "Searching...";

            const response = await fetch('https://google.serper.dev/search', {
                method: 'POST',
                headers: {
                    'X-API-KEY': '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',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ q: query })
            });

            const data = await response.json();
            resultsDiv.innerHTML = data.organic.map(item => `
                <p><a href="${item.link}" target="_blank">${item.title}</a><br>
                <small>${item.snippet}</small></p>
            `).join('');
        }
    </script>
</body>
</html>
